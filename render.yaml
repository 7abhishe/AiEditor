# ============================
# CodeGenie — Render.com Blueprint
# Infrastructure-as-Code for one-click deploy
# ============================

databases:
  - name: codegenie-db
    plan: free
    databaseName: codegenie
    user: codegenie

services:
  - type: web
    name: codegenie-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: ./build.sh
    startCommand: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codegenie-db
          property: connectionString
        # Render gives postgresql:// but we need postgresql+asyncpg://
        # This is handled in config.py
      - key: GEMINI_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: JWT_SECRET_KEY
        sync: false  # Set manually in Render dashboard

  - type: static_site
    name: codegenie-web
    repo: https://github.com/7abhishe/AiEditor
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://codegenie-backend-27y2.onrender.com
      - key: NODE_VERSION
        value: "20"
