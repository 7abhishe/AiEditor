name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Build on macOS (Apple Silicon .dmg) ───────────
  build-mac:
    name: macOS (Apple Silicon)
    runs-on: macos-14
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        uses: samuelmeuli/action-electron-builder@v1
        with:
          package_root: frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script_name: build
          args: --mac --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-arm64
          path: |
            frontend/release/*.dmg
            frontend/release/*.zip
          retention-days: 5
          if-no-files-found: warn

  # ── Build on Windows (.exe) ───────────────────────
  build-windows:
    name: Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        uses: samuelmeuli/action-electron-builder@v1
        with:
          package_root: frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script_name: build
          args: --win --publish never

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: frontend/release/*.exe
          retention-days: 5
          if-no-files-found: warn

  # ── Build on Linux (.AppImage) ────────────────────
  build-linux:
    name: Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and Package
        uses: samuelmeuli/action-electron-builder@v1
        with:
          package_root: frontend
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script_name: build
          args: --linux --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: frontend/release/*.AppImage
          retention-days: 5
          if-no-files-found: warn

  # ── Create GitHub Release with all installers ─────
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-mac, build-windows, build-linux]
    if: always() && (needs.build-mac.result == 'success' || needs.build-windows.result == 'success' || needs.build-linux.result == 'success')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: List installers
        run: ls -lhR installers/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CodeGenie ${{ github.ref_name }}
          body: |
            ## CodeGenie AI Editor — ${{ github.ref_name }}

            Download the installer for your platform:

            | Platform | File |
            |----------|------|
            | **macOS (Apple Silicon)** | `.dmg` file |
            | **Windows** | `.exe` installer |
            | **Linux** | `.AppImage` file |

            ### First Launch
            - **macOS**: Right-click the app, then Open (first time only)
            - **Windows**: Run the `.exe` installer, follow prompts
            - **Linux**: `chmod +x CodeGenie*.AppImage && ./CodeGenie*.AppImage`
          files: installers/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
